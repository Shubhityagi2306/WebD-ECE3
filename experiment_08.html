<!DOCTYPE html>
<html>
<head>
  <title>Links Demo</title>
</head>
<body>

  <p id="top">Links demo</p>

  <!-- External Link -->
  <a href="https://example.com" target="_blank">External link</a><br>

  <!-- Internal Link (Jump to bottom) -->
  <a href="#bottom">Jump to bottom</a><br>

  <!-- Email Link -->
  <a href="mailto:someone@example.com">Email us</a><br>

  <!-- Image Link -->
  <a href="https://example.com">
    <img src="logo.png" alt="Logo" width="100" height="50">
  </a>

  <!-- Spacing to simulate scrolling -->
  <div style="height: 400px;"></div>

  <p id="bottom">Bottom. <a href="#top">Back to top</a></p>

</body>
</html>
