<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 9: Quotation and Citation Elements</title>
</head>
<body>

    <!-- Blockquote for a longer, standalone quote -->
    <blockquote>
        "The best way to predict the future is to create it."
    </blockquote>
    
    <!-- Cite element for the title of a work or attribution -->
    <p>— <cite>Peter Drucker</cite></p>

    <!-- Inline quote (<q>) and Abbreviation (<abbr>) -->
    <p>
        As the <abbr title="World Wide Web Consortium">W3C</abbr> states, 
        <q>The power of the Web is in its universality.</q>
    </p>

</body>
</html>
