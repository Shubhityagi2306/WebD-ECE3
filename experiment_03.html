<!DOCTYPE html>
<html>
<head>
  <title>Block and Inline Elements</title>
</head>
<body>

  <!-- Block Elements -->
  <div style="background-color: lightblue; margin-bottom: 5px;">Block 1</div>
  <div style="background-color: lightblue; margin-bottom: 5px;">Block 2</div>

  <!-- Inline Elements -->
  <span style="background-color: lightgreen;">Inline 1</span>
  <span style="background-color: lightgreen;">Inline 2</span>
  <span style="background-color: lightgreen;">Inline 3</span>

</body>
</html>
