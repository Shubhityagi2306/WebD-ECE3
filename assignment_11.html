<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Page</title>
</head>
<body>

    <!-- Skip link for keyboard navigation -->
    <a href="#main-content">Skip to main content</a>

    <!-- Navigation landmark -->
    <nav aria-label="Main Navigation">
        <a href="#home">Home</a>
        <a href="#help">Help</a>
    </nav>

    <!-- Main content area -->
    <main id="main-content">
        <h1>Accessible Page</h1>

        <!-- Image with alternative text -->
        <img src="sample.jpg" alt="x" width="150" height="20">
        <br><br>

        <!-- Form input with explicit label and ARIA label -->
        <label for="search-box">Search:</label>
        <input type="text" id="search-box" name="search" aria-label="Search the site">
    </main>

</body>
</html>
